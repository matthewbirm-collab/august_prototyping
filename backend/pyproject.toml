[project]
name = "propline-backend"
version = "0.1.0"
description = "Market-implied NFL fantasy projections from sportsbook player-prop lines"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "apscheduler>=3.11.3",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "nflreadpy>=0.1.5",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "rapidfuzz>=3.14.6",
    "redis>=8.1.0",
    "scipy>=1.18.1",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ingest-nflverse = "ingest.nflverse.cli:main"
run-ingest = "ingest.run_ingest:main"
backfill-props = "ingest.backfill_cli:main"
calibration-report = "analytics.calibration_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "engine", "analytics", "ingest", "db"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# nflreadpy and APScheduler ship no type information.
module = ["nflreadpy", "nflreadpy.*", "apscheduler", "apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: calls real external services; skipped without API keys"]

[dependency-groups]
dev = [
    "hypothesis>=6.170.9",
    "matplotlib>=3.11.2",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "scipy-stubs>=1.18.1.1",
]
